type: object
description: Request payload for creating a customer
required:
  - firstName
  - lastName
  - email
properties:
  firstName:
    type: string
    minLength: 1
    maxLength: 50
  lastName:
    type: string
    minLength: 1
    maxLength: 50
  email:
    type: string
    format: email
  phone:
    type: string
  addresses:
    type: array
    items:
      $ref: './Address.yaml'
