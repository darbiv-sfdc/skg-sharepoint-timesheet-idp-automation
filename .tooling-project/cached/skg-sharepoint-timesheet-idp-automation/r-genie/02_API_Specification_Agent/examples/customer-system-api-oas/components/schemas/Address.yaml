type: object
properties:
  type:
    type: string
    enum: [home, work, billing, shipping]
  street:
    type: string
  city:
    type: string
  state:
    type: string
  postalCode:
    type: string
  country:
    type: string
    minLength: 2
    maxLength: 2
    description: ISO 3166-1 alpha-2 country code
  primary:
    type: boolean
    default: false
