project.groupId: ${project.groupId}
app:
  specification:
    artifactId: ${app.specification.artifactId}
    version: ${app.specification.version}
  #IANA zone for job-log timestamps (ExecutionTime/Title in the SharePoint job-log list) - falls
  #back to UTC in code if unset. SKG is based in South Africa.
  timezone: "Africa/Johannesburg"

application:
  layer: "System BO"

#Show layer in Anypoint Visualizer
anypoint:
  platform:
    visualizer:
      layer: "System BO"

#Scheduler default (override per environment as needed)
scheduler:
  initialState: "started"