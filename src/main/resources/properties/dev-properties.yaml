http:
  port: "8081"
  private: 
    port: "8091"
https:
  port: "8082"
api: 
  id: "2699159"

#IDP Configuration
idp:
    host: "idp-rt.eu-central-1.eu1.anypoint.mulesoft.com"
    port: "443"
    protocol: "HTTPS"
    action:
        id: "idp-skg-salaries-pjc"
        version: "1.0.0"
        max_checks: "20"

#SharePoint Folder Structure
sharepoint:
    site:
        url: "https://skgtechoffice.sharepoint.com/sites/MulesoftProjectSite"
        # Server-relative root of the site (prefix for absolute file paths used by file-move / file-add / file-get-content)
        serverRelativePath: "/sites/MulesoftProjectSite"
    tokenUrl: "https://login.microsoftonline.com/538f4f4e-ffdb-47b6-818d-cdb243067ad0/oauth2/v2.0/token"
    connection:
        clientId: "84b7131c-fd51-4331-a02a-68574b85ffc0"
        keyStoreAlias: "mule"
        keyStorePath: "skg-sp-server.jks"
        keyStoreType: "JKS"
        keyStorePassword: ${secure::sharepoint.connection.keyStorePassword}
        scope: "https://skgtechoffice.sharepoint.com/.default"
    # Document libraries to process, as a JSON array string (each entry is a path relative to
    # the site root; every library shares the same 01-Inbound.../99-Error subfolder convention)
    libraries: '["EKN","FLEET"]'
    folder:
        source: "01-Inbound"
        processing: "02-Processing"
        output: "03-Output"
        processed: "04-Processed"
        error: "99-Error"
    filter:
        extension: "pdf"
    # SharePoint INTERNAL column names to copy from the source PDF's list item onto the Output
    # CSV's list item (see idp-classification-flow.xml). Confirmed against the EKN library via
    # GET .../_api/web/lists/getbytitle('EKN')/fields?$select=Title,InternalName - "PDF Type"'s
    # internal name is "PDFType" (no _x0020_ space-encoding for this particular column, unlike
    # "Site"/"WeekNo" whose display and internal names happen to already match).
    classification:
        fields: '["PDFType","Site","WeekNo"]'
    # SharePoint list that receives one row per document-library run (see idp-job-logging-flow.xml)
    jobLogList:
        title: "Mule IDP Job Logs"
        listId: "89ac4892-b04b-41be-a251-f30603af4dad"

#Scheduler
scheduler:
    cron: "0 0 0/1 * * ?"
    initialState: "stopped"   # dev: HTTP /trigger-ingest only; cron scheduler disabled

#VM Persistent Queue
vm:
    queue:
        name: "idp-timesheet-queue"
    poll:
        sleepMillis: "30000"


anypoint:
    clientId: "7341fdfed4da4e9b9a9edec484d3c97d"
    clientSecret: "A6de5f71E8884083BD77b6bFbcd3fd31"

log:
  level: "DEBUG"
