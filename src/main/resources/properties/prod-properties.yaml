http:
  port: "8081"
  private:
    port: "8091"
https:
  port: "8082"
api:
  # API Manager instance ID for the standalone /trigger-ingest endpoint (see api-gateway:autodiscovery
  # in global.xml) - a separate "Basic Endpoint" API registration per environment, not a resource on
  # the main /api/v1/* RAML API.
  triggerIngestId: "2848167"

#IDP Configuration
idp:
    host: "idp-rt.eu-central-1.eu1.anypoint.mulesoft.com"
    port: "443"
    protocol: "HTTPS"
    action:
        id: "idp-skg-salaries-pjc"
        version: "1.0.0"
        max_checks: "20"

    # Connected App used by the IDP connector (scope: Document Actions -> Execute Published Actions).
    # NOT the environment credentials - those are the anypoint.platform.client_id/client_secret
    # Runtime Manager properties used by API autodiscovery (see below).
    # TODO: move clientSecret to secure props once verified.
    connectedApp:
        clientId: "78137d9f7644407c992a3058d50079de"
        clientSecret: "8a4Dd64d9B014E9282a3a8CE867Df85d"

#SharePoint Folder Structure
sharepoint:
    site:
        url: "https://skgtechoffice.sharepoint.com/sites/IDP-Payroll"
        # Server-relative root of the site (prefix for absolute file paths used by file-move / file-add / file-get-content)
        serverRelativePath: "/sites/IDP-Payroll"
    tokenUrl: "https://login.microsoftonline.com/538f4f4e-ffdb-47b6-818d-cdb243067ad0/oauth2/v2.0/token"
    connection:
        clientId: "84b7131c-fd51-4331-a02a-68574b85ffc0"
        keyStoreAlias: "mule"
        keyStorePath: "skg-sp-server.jks"
        keyStoreType: "JKS"
        keyStorePassword: ${secure::sharepoint.connection.keyStorePassword}
        scope: "https://skgtechoffice.sharepoint.com/.default"
    # Document libraries to process, as a JSON array string (each entry is a path relative to
    # the site root; every library shares the same 01-Inbound.../99-Error subfolder convention)
    libraries: '["EKN","FLEET"]'
    folder:
        source: "01-Inbound"
        processing: "02-Processing"
        output: "03-Output"
        processed: "04-Processed"
        error: "99-Error"
    filter:
        extension: "pdf"
    # SharePoint INTERNAL column names to copy from the source PDF's list item onto the Output
    # CSV's list item (see idp-classification-flow.xml). Confirmed against the EKN library via
    # GET .../_api/web/lists/getbytitle('EKN')/fields?$select=Title,InternalName - "PDF Type"'s
    # internal name is "PDFType" (no _x0020_ space-encoding for this particular column, unlike
    # "Site"/"WeekNo" whose display and internal names happen to already match).
    classification:
        fields: '["PDFType","Site","WeekNo"]'
    # SharePoint list that receives one row per document-library run (see idp-job-logging-flow.xml)
    jobLogList:
        title: "Mule IDP Job Logs"
        listId: "5904497e-bd96-4cca-a329-bb52cd49846d"

#Scheduler
scheduler:
    cron: "0 0 0/1 * * ?"
    initialState: "started"   # prod: hourly cron scheduler active

#VM Persistent Queue
vm:
    queue:
        name: "idp-timesheet-queue"
    poll:
        sleepMillis: "30000"


# API autodiscovery (gatekeeper) needs the Production ENVIRONMENT client ID/secret (Access Management ->
# Business Groups -> Environments), supplied as Runtime Manager properties anypoint.platform.client_id
# and anypoint.platform.client_secret (secret Protected) - not set in this file.

log:
  level: "DEBUG"
