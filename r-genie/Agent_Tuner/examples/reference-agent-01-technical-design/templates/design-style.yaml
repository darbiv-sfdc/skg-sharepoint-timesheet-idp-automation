# TECHNICAL DESIGN AGENT - TEMPLATE CONFIGURATION
# 
# ⚠️ CRITICAL: This template controls DESIGN DOCUMENT structure
# 
# SECTION INCLUSION RULES:
#   include: true  → Section MUST be generated
#   include: false → Section MUST NOT be generated
# 
# The agent will ONLY generate sections where include: true
# Examples are for FORMATTING reference only, not structure
#
# DIAGRAM PLACEMENT:
#   - Connector Pattern Diagram → Embedded in Technical Architecture section
#   - Integration Sequence Diagram → Embedded in Flow Architecture section
#     * BEST PRACTICE: Place each sequence diagram immediately after its endpoint flow table
#     * Avoid grouping all diagrams in a separate section
#   - Error Handling Flow Diagram → Embedded in Error Handling Strategy section
#   - NO standalone "Essential Diagrams" section
#
# TABLE FORMATTING:
#   - Use plain text separators (commas) instead of HTML <br> tags in table cells
#   - Ensures proper rendering across all markdown viewers

project_name: ""

outputs:
  single_document: true
  config_files: true

structure:
  # Main document sections (Phase 0-4)
  sections:
    - name: "Project Overview"
      description: "Brief project description, source/target systems, volume, pattern"
      include: true

    - name: "Technical Architecture"
      description: "API-Led pattern, processing strategy, connector summary table, Connector Pattern Diagram"
      include: true
    
    - name: "Flow Architecture"
      description: "Step-by-step flow design tables for each flow, Integration Sequence Diagram"
      include: true
    
    - name: "Field Mapping Tables"
      description: "Source-to-target data mappings (NO DataWeave code)"
      include: true
    
    - name: "Error Handling Strategy"
      description: "Error categories table, retry patterns, DLQ configuration, Error Handling Flow Diagram"
      include: true

  # Supplementary sections (Phase 5 - appended to main document when user says 'all per template')
  supplementary:
    - name: "Security Considerations"
      description: "Authentication & Authorization, Data Encryption, Secure Credential Management, API Security"
      include: true
    
    - name: "Performance & Monitoring"
      description: "Performance Optimization, Monitoring & Logging Strategy, Health Checks (for APIs)"
      include: true
    
    - name: "Configuration Files"
      description: "YAML config files: dev, test, prod, secure"
      include: true
    
    - name: "Additional Diagrams"
      description: "System Architecture diagram, Data Flow diagram"
      include: true
    
    - name: "Deployment Guide"
      description: "CloudHub config, deployment procedures, rollback"
      include: false
      # ⚠️ Set to false: Do NOT generate this section

naming:
  file_pattern: "{project}-technical-design.md"
  heading_style: "Title Case"

style:
  include_diagrams: true
  diagram_format: "mermaid"
  include_sample_payloads: true


# ============================================
# VALIDATION RULES
# ============================================
# 
# Before generating design document, agent must:
# 1. Parse this file
# 2. Extract structure.sections array
# 3. Filter sections where include: true
# 4. Generate ONLY those sections
# 5. Verify no sections with include: false are present
# 6. Verify no sections NOT in this template are present
# 7. Embed diagrams contextually:
#    - Connector Pattern Diagram in Technical Architecture section
#    - Integration Sequence Diagram in Flow Architecture section
#    - Error Handling Flow Diagram in Error Handling Strategy section
# 
# EXAMPLES are for formatting (headings, tables, Mermaid syntax)
# TEMPLATE is for structure (which sections to include)
#
